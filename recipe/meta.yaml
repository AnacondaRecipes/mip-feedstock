{% set name = "mip" %}
{% set version = "2.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/mip-{{ version }}.tar.gz
  sha256: f3b68df2d3b42597012811e5d6a1742da987d1fc19e4c12fdc0cfb2df7f68d60

build:
  #noarch: python
  #skip: true  # [not linux64 or aarch64 or win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python 
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python 
    - cffi >=1.15
    - cbcbox >=2.937

test:
  imports:
    - mip
  commands:
    - pip check
  requires:
    - pip


about:
  home: https://github.com/coin-or/python-mip
  summary: Python tools for Modeling and Solving Mixed-Integer Linear Programs (MIPs)
  description: a collection of Python tools for the modeling and solution of Mixed-Integer Linear programs (MIPs)
  license: EPL-2.0
  license_family: OTHER
  license_file: LICENSE
  dev_url: https://github.com/coin-or/python-mip
  doc_url: https://github.com/coin-or/python-mip/tree/master/docs

extra:
  skip-lints:
    - host_section_needs_exact_pinnings
    - avoid_noarch
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/110080
    reason: Client request
  recipe-maintainers:
    - ianaobi
